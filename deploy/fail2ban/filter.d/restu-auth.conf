# fail2ban filter buat login gagal RESTU. Sumbernya baris error_log() di
# log_aktivitas() (includes/log.php) - log_aktivitas DB gak bisa di-grep
# fail2ban, ini baris teks paralelnya, cuma nyala buat aksi 'login_gagal'.
# <HOST> = token fail2ban buat regex IP (v4/v6), jangan diubah.
[Definition]
failregex = ^.*RESTU_AUTH_FAIL ip=<HOST> .*$
ignoreregex =
