# Ban per-IP buat scan/bruteforce login RESTU - beda dari lockout per-akun
# yang udah ada di includes/auth.php (AUTH_MAX_ATTEMPTS=5/15 menit), yang
# itu cuma jalan kalau username-nya beneran ada di tabel user. Payload SQLi
# (mis. "' OR 1=1-- -" sebagai username) gak match akun manapun, jadi lolos
# dari lockout itu sepenuhnya - fail2ban nutup celah itu di level IP.
#
# maxretry=8/findtime=300 sengaja di atas ambang lockout akun (5), biar
# beberapa pegawai beda akun yang sama-sama salah ketik dari IP kantor yang
# sama (NAT) dalam 5 menit gak ikut kena ban - lihat catatan CGNAT di bawah.
#
# PERINGATAN: ban ini per-IP, bukan per-akun. Kalau IP-nya kebagian (NAT
# kantor/ISP seluler CGNAT), semua orang di IP itu ikut keblok akses ke
# server (bukan cuma ke halaman login) selama bantime. Unban manual sebelum
# bantime abis: `fail2ban-client set restu-auth unbanip <ip>`.
[restu-auth]
enabled  = true
filter   = restu-auth
logpath  = /var/www/restu/storage/app.log
port     = http,https
maxretry = 8
findtime = 300
bantime  = 1800
